name: intention
description: "Intention — an offline, privacy-first meditation timer."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  just_audio: ^0.9.42
  wakelock_plus: ^1.2.10
  flutter_local_notifications: ^18.0.1
  file_picker: ^8.1.6
  share_plus: ^10.1.3
  path_provider: ^2.1.5
  intl: ^0.20.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  image: ^4.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAFAF7"
  adaptive_icon_foreground: "assets/icon/icon_adaptive.png"


  fonts:
    - family: SourceSansPro
      fonts:
        - asset: assets/fonts/SourceSansPro-Light.otf
          weight: 300
        - asset: assets/fonts/SourceSansPro-LightIt.otf
          weight: 300
          style: italic
        - asset: assets/fonts/SourceSansPro-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceSansPro-It.otf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSansPro-Semibold.otf
          weight: 600
        - asset: assets/fonts/SourceSansPro-SemiboldIt.otf
          weight: 600
          style: italic
        - asset: assets/fonts/SourceSansPro-Bold.otf
          weight: 700
        - asset: assets/fonts/SourceSansPro-BoldIt.otf
          weight: 700
          style: italic
